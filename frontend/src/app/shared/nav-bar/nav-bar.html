<header class="nav-bar" [class.scrolled]="scrolled()">
  <div class="nav-inner">
    <a routerLink="/" class="nav-brand" (click)="closeMenu()">Driv<span>Ease</span></a>

    <button class="nav-toggle" (click)="toggleMenu()" [class.open]="menuOpen()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    @if (menuOpen()) { <div class="nav-menu-backdrop" (click)="closeMenu()"></div> }

    <nav class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/browse" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Browse Schools</a>
      @if (user) {
        <a [routerLink]="dashboardLink" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Dashboard</a>
        <button class="nav-link-btn" (click)="logout(); closeMenu()">Sign Out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Login</a>
        <a routerLink="/signup" class="nav-signup-btn button-interactive" (click)="closeMenu()">Sign Up</a>
      }
    </nav>
  </div>
</header>
