<app-nav-bar></app-nav-bar>

<div class="pw-page">
  <div class="pw-card fade-up">
    <p class="pw-eyebrow">Password Reset</p>
    <h1>Forgot your password?</h1>

    @if (sent()) {
      <p class="pw-success">✓ {{ message() }}</p>
      <a routerLink="/login" class="pw-back">← Back to sign in</a>
    } @else {
      <p class="pw-sub">Enter your account email and we'll send you a link to reset your password.</p>
      <form (ngSubmit)="onSubmit()">
        <div class="pw-field">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required />
        </div>
        @if (message()) { <p class="pw-error">{{ message() }}</p> }
        <button type="submit" class="pw-submit button-interactive" [disabled]="loading()">
          @if (loading()) { <span class="btn-spinner"></span> Sending… } @else { Send Reset Link }
        </button>
      </form>
      <a routerLink="/login" class="pw-back">← Back to sign in</a>
    }
  </div>
</div>
