<app-nav-bar></app-nav-bar>

<div class="pw-page">
  <div class="pw-card fade-up">
    <p class="pw-eyebrow">Password Reset</p>
    <h1>Choose a new password</h1>

    @if (!hasToken) {
      <p class="pw-error">This reset link is missing its token. Please request a new one.</p>
      <a routerLink="/forgot-password" class="pw-back">← Request a new link</a>
    } @else {
      <p class="pw-sub">Enter a new password for your account.</p>
      <form (ngSubmit)="onSubmit()">
        <div class="pw-field">
          <label>New Password</label>
          <div class="password-wrap">
            <input [type]="showPassword() ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              {{ showPassword() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>
        <div class="pw-field">
          <label>Confirm Password</label>
          <input [type]="showPassword() ? 'text' : 'password'" name="confirm" [(ngModel)]="confirm" placeholder="Repeat password" required />
        </div>
        @if (message()) { <p class="pw-error">{{ message() }}</p> }
        <button type="submit" class="pw-submit button-interactive" [disabled]="loading()">
          @if (loading()) { <span class="btn-spinner"></span> Updating… } @else { Update Password }
        </button>
      </form>
      <a routerLink="/login" class="pw-back">← Back to sign in</a>
    }
  </div>
</div>
